name: Sovereign Air Combat CI Verification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  run-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install numpy scipy

      - name: Run Judge Verification Checks
        run: |
          python tests/run_all_checks.py

      - name: Test Air Combat CLI
        run: |
          python src/cli.py battle --scenario 5v5_bvr
